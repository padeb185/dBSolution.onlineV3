{% if request.GET.saved == "1" or request.GET.deleted == "1" %}
<script>
    window.__goingBack = true;

    const flash = [
        {% for message in messages %}
        { text: "{{ message|escapejs }}", tags: "{{ message.tags }}" },
        {% endfor %}
    ];
    // On n'écrase jamais un message existant avec une liste vide
    if (flash.length) {
        sessionStorage.setItem("flashMessages", JSON.stringify(flash));
    }
    sessionStorage.setItem("reloadAfterBack", "1");

    window.history.go({% if request.GET.deleted == "1" %}-3{% else %}-2{% endif %});
</script>
{% endif %}
