{# Plaque d'immatriculation compacte (mise en forme par pays). Variables : o = OccupationBox #}
{% with s=o.plaque %}<span class="pk-plaque" style="--pf:{{ s.fond }};--pt:{{ s.texte }};--pb:{{ s.bordure }}" data-pays="{{ s.pays }}">{% if s.bande %}<span class="pk-ue">{% if s.etoiles %}<svg viewBox="0 0 20 20" aria-hidden="true"><g fill="#FFDD00"><circle cx="10" cy="3" r="1.3"/><circle cx="13.5" cy="3.94" r="1.3"/><circle cx="16.06" cy="6.5" r="1.3"/><circle cx="17" cy="10" r="1.3"/><circle cx="16.06" cy="13.5" r="1.3"/><circle cx="13.5" cy="16.06" r="1.3"/><circle cx="10" cy="17" r="1.3"/><circle cx="6.5" cy="16.06" r="1.3"/><circle cx="3.94" cy="13.5" r="1.3"/><circle cx="3" cy="10" r="1.3"/><circle cx="3.94" cy="6.5" r="1.3"/><circle cx="6.5" cy="3.94" r="1.3"/></g></svg>{% endif %}<b>{{ s.code }}</b></span>{% elif s.suisse %}<span class="pk-ue pk-ch"><svg viewBox="0 0 32 38" aria-hidden="true"><path d="M2 2 H30 V17 C30 27 23 33 16 36 C9 33 2 27 2 17 Z" fill="#DA291C"/><rect x="13.25" y="8" width="5.5" height="18" fill="#fff"/><rect x="7" y="14.25" width="18" height="5.5" fill="#fff"/></svg></span>{% endif %}<span class="pk-num">{{ o.immatriculation }}</span></span>{% endwith %}
