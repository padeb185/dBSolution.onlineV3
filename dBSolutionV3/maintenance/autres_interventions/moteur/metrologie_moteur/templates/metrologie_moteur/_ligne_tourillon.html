{% load i18n %}<tr class="ligne-tour" data-prefix="{{ f.prefix }}">
    <td class="border px-2 py-1 text-center">{% for h in f.hidden_fields %}{{ h }}{% endfor %}{{ f.numero }}</td>
    <td class="border px-1 py-1">{{ f.section_1_a }}</td>
    <td class="border px-1 py-1">{{ f.section_1_b }}</td>
    <td class="border px-1 py-1">{{ f.section_2_a }}</td>
    <td class="border px-1 py-1">{{ f.section_2_b }}</td>
    <td class="border px-2 py-1 text-right font-mono resultat" data-calc="tourillon_diametre">—</td>
    <td class="border px-2 py-1 text-right font-mono resultat" data-calc="tourillon_ovalisation">—</td>
    <td class="border px-2 py-1 text-right font-mono resultat" data-calc="tourillon_conicite">—</td>
    <td class="border px-1 py-1">{{ f.remarque }}</td>
    <td class="border px-2 py-1 text-center">{% if f.instance.pk %}<label class="text-xs text-red-700">{{ f.DELETE }} {% trans "Suppr." %}</label>{% else %}<button type="button" class="retirer-ligne text-red-700 font-bold" title="{% trans 'Retirer' %}">✕</button>{% endif %}</td>
</tr>
