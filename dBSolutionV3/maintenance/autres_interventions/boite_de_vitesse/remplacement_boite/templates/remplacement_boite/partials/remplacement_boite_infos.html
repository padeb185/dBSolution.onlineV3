{% load i18n %}
{% with pieces=obj.pieces_deposees %}
<div class="mt-2">
    <p class="font-semibold mb-2">{% trans "Pièces démontées (dépose / repose)" %} :</p>
    {% if pieces %}
        <ul class="flex flex-wrap gap-2">
            {% for piece in pieces %}<li class="px-3 py-1 rounded-full bg-green-100 text-green-800 border border-green-300 text-sm font-semibold">✔ {{ piece }}</li>{% endfor %}
        </ul>
    {% else %}
        <p class="text-gray-500">-</p>
    {% endif %}
</div>
{% endwith %}
