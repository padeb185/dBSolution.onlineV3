{% load i18n static %}
<h1 class="text-2xl font-bold mb-6 flex flex-col md:flex-row md:items-center gap-3">
    <div class="flex items-center gap-3">
        <img src="{% static 'icons/em_faisceau.png' %}" alt="{% trans 'Plan de câblage' %}" class="w-16 h-16">
        <div class="flex items-center gap-2">
            {{ titre }} :
            {% static 'images/marques/' as marques_path %}
            <img src="{{ marques_path }}{{ exemplaire.voiture_modele.voiture_marque.nom_marque|lower }}.png"
                 alt="{{ exemplaire.voiture_modele.voiture_marque.nom_marque }}" class="w-20 h-20 object-contain">
            <span class="font-semibold">{{ exemplaire.voiture_modele.nom_modele }}{% if exemplaire.voiture_modele.nom_variante %} {{ exemplaire.voiture_modele.nom_variante }}{% endif %}</span>
        </div>
    </div>
    {% include "maintenance/partials/plaque.html" %}
</h1>
