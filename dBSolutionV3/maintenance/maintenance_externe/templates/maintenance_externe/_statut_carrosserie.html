{% load i18n %}{# Badge de statut. Paramètre : c (CarrosserieExterne) #}
<span class="inline-block whitespace-nowrap rounded px-2 py-0.5 text-xs font-semibold
    {% if c.statut == 'FACTURE' %}bg-green-100 text-green-800{% elif c.statut == 'DEVIS_REFUSE' %}bg-red-100 text-red-800{% elif c.statut == 'DEVIS_ACCEPTE' or c.statut == 'EN_COURS' %}bg-blue-100 text-blue-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">
    {{ c.get_statut_display }}
</span>
