{# Pastille d'étiquette d'une maintenance : tag = VERT / JAUNE / ROUGE #}
{% load i18n %}
{% if tag == "VERT" %}<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800 border border-green-300"><span class="w-2 h-2 rounded-full bg-green-500"></span>{{ label|default:_("Vert") }}</span>
{% elif tag == "ROUGE" %}<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-800 border border-red-300"><span class="w-2 h-2 rounded-full bg-red-500"></span>{{ label|default:_("Rouge") }}</span>
{% elif tag == "JAUNE" %}<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800 border border-yellow-300"><span class="w-2 h-2 rounded-full bg-yellow-400"></span>{{ label|default:_("Jaune") }}</span>
{% else %}—{% endif %}
