{% load static %}            <li class="choix-option flex flex-wrap items-center gap-4 px-3 py-2 cursor-pointer hover:bg-blue-50 border-b last:border-b-0"
                role="option" data-id="{{ ex.pk }}"
                data-recherche="{{ ex.immatriculation|lower }} {{ ex.voiture_marque.nom_marque|lower }} {{ ex.voiture_modele.nom_modele|lower }} {{ ex.voiture_modele.nom_variante|default:''|lower }}">
                <img src="{% static 'images/marques/' %}{{ ex.voiture_marque.nom_marque|lower }}.png"
                     alt="{{ ex.voiture_marque.nom_marque }}" title="{{ ex.voiture_marque.nom_marque }}"
                     class="w-10 h-10 object-contain"
                     onerror="this.onerror=null;this.replaceWith(document.createTextNode('{{ ex.voiture_marque.nom_marque|escapejs }}'));">
                <span class="font-semibold flex-1 min-w-[120px]">
                    {{ ex.voiture_modele.nom_modele }}{% if ex.voiture_modele.nom_variante %} {{ ex.voiture_modele.nom_variante }}{% endif %}
                </span>
                {% if ex.immatriculation %}
                    {% include "maintenance/partials/plaque.html" with exemplaire=ex taille="petite" %}
                {% endif %}
            </li>
