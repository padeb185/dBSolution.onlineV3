# ==========================================================================
# À ajouter dans le bloc « server { ... } » HTTPS de carscosts.com (nginx)
# puis : sudo nginx -t && sudo systemctl reload nginx
# ==========================================================================

# 1) Django doit savoir que la requête est en HTTPS (cookies sécurisés, CSRF)
#    — dans le bloc « location / { proxy_pass ... } » :
#
#    proxy_set_header Host              $host;
#    proxy_set_header X-Forwarded-Proto $scheme;
#    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# 2) Documents privés : jamais servis directement (ils passent par Django, connexion obligatoire)
location ^~ /media/prive/ {
    deny all;
    return 404;
}
location ^~ /media/assurances/ {   # anciens PDF de polices, avant le passage en « prive/ »
    deny all;
    return 404;
}

# 3) Fichiers publics (images…) : pas d'exécution, pas de devinette de type
location /media/ {
    alias /var/www/carscosts/dBSolutionV3/media/;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
}

# 4) Ne jamais servir les fichiers sensibles s'ils se retrouvaient dans un dossier public
location ~* \.(env|key|pem|py|pyc|sqlite3|log)$ {
    deny all;
    return 404;
}
