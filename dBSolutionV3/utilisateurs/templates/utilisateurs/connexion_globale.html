{% extends "base.html" %}

{% block content %}

<div class="flex justify-center items-center w-full">
    <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-md flex flex-col items-stretch gap-4">

        <h1 class="text-2xl font-bold mb-2 text-center">
            Connexion
        </h1>

        <p class="text-center text-sm text-gray-500 mb-4">
            Connectez-vous pour accéder à votre société.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="
                    mb-3 px-4 py-2 rounded
                    {% if message.tags == 'success' %}
                        bg-green-100 text-green-800 border border-green-300
                    {% else %}
                        bg-red-100 text-red-800 border border-red-300
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form
            method="post"
            action="{% url 'connexion_globale' %}"
            class="flex flex-col gap-4 w-full"
        >
            {% csrf_token %}

            <input
                type="email"
                name="email"
                value="{{ request.POST.email|default:'' }}"
                placeholder="Email"
                autocomplete="email"
                required
                class="w-full border border-gray-300 px-3 py-2 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
            >

            <input
                type="password"
                name="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
                required
                class="w-full border border-gray-300 px-3 py-2 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
            >

            <input
                type="text"
                name="totp_code"
                placeholder="Code TOTP si activé"
                autocomplete="one-time-code"
                inputmode="numeric"
                class="w-full border border-gray-300 px-3 py-2 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
            >

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition duration-300"
            >
                Se connecter
            </button>
        </form>

        <div class="text-center text-sm text-gray-500 mt-2">
            <a
                href="{% url 'password_reset' %}"
                class="hover:underline hover:text-blue-700"
            >
                Mot de passe oublié ?
            </a>
        </div>

        <div class="hidden bg-blue-700 hover:bg-blue-700 text-gray-700 text-gray-500 border-gray-300 px-4 py-2 rounded shadow-md flex flex-col items-center justify-center"></div>

    </div>
</div>
    <script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + "=")) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');
    </script>


{% endblock %}
