{% load widget_tweaks %}
<div class="mb-4">
    <label for="{{ field.id_for_label }}" class="block font-semibold mb-1">
        {{ field.label }}
        {% if manquant_label and field.value is None or manquant_label and field.value == "" %}
            <span class="ml-2 px-2 py-0.5 rounded bg-orange-100 text-orange-800 text-xs font-normal">{{ manquant_label }}</span>
        {% endif %}
    </label>

    {% if field.errors %}
        {{ field|add_class:"input input-error" }}
    {% else %}
        {{ field|add_class:"input" }}
    {% endif %}

    {% if field.help_text %}
        <p class="text-gray-500 text-sm mt-1">{{ field.help_text }}</p>
    {% endif %}

    {% if field.errors %}
        <p class="text-red-600 text-sm mt-1">{{ field.errors|striptags }}</p>
    {% endif %}
</div>
