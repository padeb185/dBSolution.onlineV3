{% load i18n %}{% with e=suivi.etat %}<span class="inline-block px-2 py-1 rounded text-sm font-semibold
    {% if e == 'OK_SORTIE' %}bg-green-600 text-white
    {% elif e == 'PREPARATION' %}bg-gray-200 text-gray-700
    {% elif e == 'EN_LOCATION' %}bg-blue-100 text-blue-800
    {% elif e == 'PROBLEME' %}bg-red-600 text-white
    {% else %}bg-yellow-100 text-yellow-800{% endif %}">{{ suivi.etat_display }}</span>{% endwith %}
