# /etc/carscosts-backup.conf  (root:root, chmod 600)
# Dépôt restic carscosts (le même que /usr/local/sbin/backup_carscosts.sh)
RESTIC_REPOSITORY=/var/backups/restic
# Fichier contenant le mot de passe du dépôt (root:root, chmod 600)
RESTIC_PASSWORD_FILE=/root/.restic-password
# Groupe qui doit pouvoir lire le dépôt pour la copie vers le Mac
REPO_GROUP=backup

PG_PORT=5435
PG_DB=dbsolution_db
PG_BIN=/usr/lib/postgresql/19/bin
TABLE_TENANTS=societe_societe
DUMP_DIR=/var/backups/carscosts/dumps
KEEP="--keep-daily 7 --keep-weekly 4 --keep-monthly 12 --keep-yearly 3"  # identique à backup_carscosts.sh
